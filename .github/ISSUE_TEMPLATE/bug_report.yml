name: Bug report
description: Report a reproducible Windows Keyboard for Mac mapping or installation problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach a live `karabiner.json`, logs containing typed text, recordings, email addresses, or local user paths.

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "For example: macOS 15.6"
    validations:
      required: true

  - type: input
    id: karabiner
    attributes:
      label: Karabiner-Elements version
      placeholder: "For example: 16.0.0"
    validations:
      required: true

  - type: input
    id: keyboard
    attributes:
      label: Physical keyboard
      description: Manufacturer, model, and whether the keyboard is in Windows or Mac mode.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the physical shortcut, expected result, and actual result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Connect...
        2. Press...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Run `doctor.command` and remove anything you do not want to publish.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed personal or sensitive information.
          required: true
