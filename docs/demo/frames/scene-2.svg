      <text x="754" y="426" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Built-in Apple keyboard</text>
