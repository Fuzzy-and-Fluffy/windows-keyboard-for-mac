<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="keyAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="keyNeutral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26354d"/>
      <stop offset="1" stop-color="#162238"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1030" cy="110" r="300" fill="url(#glow)"/>
  <circle cx="150" cy="640" r="260" fill="url(#glow)" opacity="0.55"/>
  <rect x="31" y="26" width="1138" height="603" rx="30" fill="none" stroke="#20304a" stroke-width="2"/>
  <text x="64" y="72" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" text-anchor="start" letter-spacing="2.2" opacity="1">WINDOWS KEYBOARD FOR MAC</text>
  <text x="1136" y="72" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="end" letter-spacing="1.4" opacity="1">SHORTCUT WALKTHROUGH</text>

    <text x="64" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">Alt+F4 closes the window—not the whole app</text>

    <g filter="url(#shadow)">
      <rect x="66" y="202" width="112" height="66" rx="15" fill="url(#keyAccent)" stroke="#60a5fa" stroke-width="2"/>
      <path d="M 76 259 H 168" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <text x="122" y="243" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">Alt</text>
    </g>
    <text x="196" y="245" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">+</text>

    <g filter="url(#shadow)">
      <rect x="232" y="202" width="112" height="66" rx="15" fill="url(#keyAccent)" stroke="#60a5fa" stroke-width="2"/>
      <path d="M 242 259 H 334" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <text x="288" y="243" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">F4</text>
    </g>
    <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M 377 235 H 467"/><path d="M 454 224 L 467 235 L 454 246"/></g>
    <text x="500" y="229" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Windows-style top-level window close</text>

    <g>
      <rect x="66" y="326" width="328" height="104" rx="20" fill="#101b31" stroke="#263854" stroke-width="2"/>
      <rect x="66" y="326" width="7" height="104" rx="4" fill="#3b82f6"/>
      <text x="96" y="364" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Chrome · Edge · Safari · Firefox</text>
      <text x="96" y="400" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">Close browser window</text>
    </g>

    <g>
      <rect x="416" y="326" width="328" height="104" rx="20" fill="#101b31" stroke="#263854" stroke-width="2"/>
      <rect x="416" y="326" width="7" height="104" rx="4" fill="#8b5cf6"/>
      <text x="446" y="364" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Finder</text>
      <text x="446" y="400" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">Close front Finder window</text>
    </g>

    <g>
      <rect x="766" y="326" width="328" height="104" rx="20" fill="#101b31" stroke="#263854" stroke-width="2"/>
      <rect x="766" y="326" width="7" height="104" rx="4" fill="#14b8a6"/>
      <text x="796" y="364" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Other macOS apps</text>
      <text x="796" y="400" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">Close active window</text>
    </g>
    <text x="66" y="473" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Ctrl+F4 remains separate</text>
    <text x="66" y="506" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">It closes the active document or tab, matching the Windows distinction.</text>
  <text x="64" y="606" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="550" text-anchor="start" letter-spacing="0" opacity="1">Physical keys shown · Selected Windows keyboards only</text>
  <rect x="527" y="626" width="8" height="8" rx="4" fill="#334155"/><rect x="554" y="626" width="8" height="8" rx="4" fill="#334155"/><rect x="581" y="626" width="20" height="8" rx="4" fill="#60a5fa"/><rect x="608" y="626" width="8" height="8" rx="4" fill="#334155"/><rect x="635" y="626" width="8" height="8" rx="4" fill="#334155"/><rect x="662" y="626" width="8" height="8" rx="4" fill="#334155"/>
</svg>