      <text x="616" y="234" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">UNINSTALL</text>
