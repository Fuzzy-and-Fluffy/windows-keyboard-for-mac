      <text x="94" y="270" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">Rename the selected item</text>
